<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>WebGL domain-colouring benchmark prototype</title>
<style>
  body { background:#111; color:#eee; font-family:monospace; }
  canvas { border:1px solid #444; image-rendering: pixelated; }
  #out { white-space: pre; font-size: 13px; }
</style>
</head>
<body>
<canvas id="c" width="8" height="8"></canvas>
<div id="out">not run yet</div>
<script>
// Standalone benchmark: NOT wired into the real app. Measures pure per-frame GPU cost of
// evaluating a domain-colouring fragment shader over a full grid, for a few representative
// function "shapes" (plain polynomial, a rational/division-heavy function, and an iterative
// special-function-like loop mimicking gamma's Lanczos cost) - used to sanity-check whether a
// true "recompute every frame, no caching" WebGL colour layer is plausible before investing in
// a full mathjs-AST-to-GLSL transpiler.

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { antialias: false, alpha: false, preserveDrawingBuffer: false })
        || canvas.getContext('experimental-webgl');

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    throw new Error('shader compile error: ' + gl.getShaderInfoLog(s) + '\n' + src);
  }
  return s;
}

function buildProgram(fsSrc) {
  const vsSrc = `
    attribute vec2 aPos;
    varying vec2 vUv;
    void main() {
      vUv = (aPos + 1.0) * 0.5;
      gl_Position = vec4(aPos, 0.0, 1.0);
    }
  `;
  const vs = compile(gl.VERTEX_SHADER, vsSrc);
  const fs = compile(gl.FRAGMENT_SHADER, fsSrc);
  const prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    throw new Error('program link error: ' + gl.getProgramInfoLog(prog));
  }
  return prog;
}

// Full-screen quad (two triangles), shared by every program.
const quadBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

const COMMON = `
  precision highp float;
  varying vec2 vUv;
  uniform vec4 uBounds; // minX, maxX, minY, maxY
  uniform float uScale;
  const float PI = 3.14159265358979323846;

  vec2 cmul(vec2 a, vec2 b) { return vec2(a.x*b.x - a.y*b.y, a.x*b.y + a.y*b.x); }
  vec2 cdiv(vec2 a, vec2 b) {
    float d = b.x*b.x + b.y*b.y;
    return vec2(a.x*b.x + a.y*b.y, a.y*b.x - a.x*b.y) / d;
  }
  vec2 conjv(vec2 a) { return vec2(a.x, -a.y); }
  vec2 cexp(vec2 a) { float m = exp(a.x); return vec2(m*cos(a.y), m*sin(a.y)); }
  vec2 clog(vec2 a) { return vec2(log(length(a)), atan(a.y, a.x)); }
  vec2 cpow(vec2 a, vec2 b) { return cexp(cmul(b, clog(a))); }
  // GLSL ES 1.00 (WebGL1) has no built-in sinh/cosh - expand directly from exp().
  float sinhf(float x) { return (exp(x) - exp(-x)) * 0.5; }
  float coshf(float x) { return (exp(x) + exp(-x)) * 0.5; }
  vec2 csin(vec2 a) { return vec2(sin(a.x)*coshf(a.y), cos(a.x)*sinhf(a.y)); }

  vec3 hsl2rgb(float h, float s, float l) {
    float q = l < 0.5 ? l * (1.0 + s) : l + s - l * s;
    float p = 2.0 * l - q;
    vec3 t = vec3(h + 1.0/3.0, h, h - 1.0/3.0);
    vec3 res;
    for (int i = 0; i < 3; i++) {
      float tt = t[i];
      if (tt < 0.0) tt += 1.0;
      if (tt > 1.0) tt -= 1.0;
      float v;
      if (tt < 1.0/6.0) v = p + (q - p) * 6.0 * tt;
      else if (tt < 0.5) v = q;
      else if (tt < 2.0/3.0) v = p + (q - p) * (2.0/3.0 - tt) * 6.0;
      else v = p;
      res[i] = v;
    }
    return res;
  }

  vec3 domainColor(vec2 w) {
    float m = length(w);
    float hue = atan(w.y, w.x);
    if (hue < 0.0) hue += 2.0 * PI;
    hue /= 2.0 * PI;
    float lm = log(1.0 + m);
    float light = lm / (lm + uScale);
    return hsl2rgb(hue, 1.0, light);
  }

  vec2 worldPos() {
    float x = mix(uBounds.x, uBounds.y, vUv.x);
    float y = mix(uBounds.w, uBounds.z, vUv.y);
    return vec2(x, y);
  }
`;

// Mode 1: plain polynomial, e.g. z^3 - conj(z) + 1  (cheap, no division)
const FS_POLY = COMMON + `
  void main() {
    vec2 z = worldPos();
    vec2 z2 = cmul(z, z);
    vec2 z3 = cmul(z2, z);
    vec2 w = z3 - conjv(z) + vec2(1.0, 0.0);
    gl_FragColor = vec4(domainColor(w), 1.0);
  }
`;

// Mode 2: rational function with abs/conj mixed in, e.g. (z^2+conj(z)) / (z - (1+0.5i))
const FS_RATIONAL = COMMON + `
  void main() {
    vec2 z = worldPos();
    vec2 num = cmul(z, z) + conjv(z);
    vec2 den = z - vec2(1.0, 0.5);
    vec2 w = cdiv(num, den);
    gl_FragColor = vec4(domainColor(w), 1.0);
  }
`;

// Mode 3: iterative special-function-like cost, a real Lanczos complex gamma approximation
// (g=7, 9 terms + reflection formula) - mimics the per-pixel cost profile of the app's most
// expensive real supported functions (gamma/zeta), not just a dummy busy-loop.
const FS_GAMMA = COMMON + `
  vec2 cgammaPos(vec2 z) {
    vec2 zm1 = vec2(z.x - 1.0, z.y);
    vec2 x = vec2(0.99999999999980993, 0.0);
    x += cdiv(vec2(676.5203681218851, 0.0),      zm1 + vec2(1.0, 0.0));
    x += cdiv(vec2(-1259.1392167224028, 0.0),    zm1 + vec2(2.0, 0.0));
    x += cdiv(vec2(771.32342877765313, 0.0),     zm1 + vec2(3.0, 0.0));
    x += cdiv(vec2(-176.61502916214059, 0.0),    zm1 + vec2(4.0, 0.0));
    x += cdiv(vec2(12.507343278686905, 0.0),     zm1 + vec2(5.0, 0.0));
    x += cdiv(vec2(-0.13857109526572012, 0.0),   zm1 + vec2(6.0, 0.0));
    x += cdiv(vec2(9.9843695780195716e-6, 0.0),  zm1 + vec2(7.0, 0.0));
    x += cdiv(vec2(1.5056327351493116e-7, 0.0),  zm1 + vec2(8.0, 0.0));
    vec2 t = zm1 + vec2(7.5, 0.0);
    vec2 tPow = cpow(t, vec2(zm1.x + 0.5, zm1.y));
    vec2 tExp = cexp(-t);
    return cmul(vec2(sqrt(2.0 * PI), 0.0), cmul(tPow, cmul(tExp, x)));
  }
  vec2 cgamma(vec2 z) {
    if (z.x < 0.5) {
      vec2 omz = vec2(1.0 - z.x, -z.y);
      vec2 g = cgammaPos(omz);
      vec2 sinpiz = csin(cmul(vec2(PI, 0.0), z));
      return cdiv(vec2(PI, 0.0), cmul(sinpiz, g));
    }
    return cgammaPos(z);
  }
  void main() {
    vec2 z = worldPos();
    vec2 w = cgamma(z);
    gl_FragColor = vec4(domainColor(w), 1.0);
  }
`;

const programs = {
  poly: buildProgram(FS_POLY),
  rational: buildProgram(FS_RATIONAL),
  gamma: buildProgram(FS_GAMMA)
};

function draw(prog, minX, maxX, minY, maxY, scale) {
  gl.useProgram(prog);
  const aPos = gl.getAttribLocation(prog, 'aPos');
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
  gl.uniform4f(gl.getUniformLocation(prog, 'uBounds'), minX, maxX, minY, maxY);
  gl.uniform1f(gl.getUniformLocation(prog, 'uScale'), scale);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

// Forces a GPU/CPU sync point (readPixels blocks until the draw completes), giving a reliable
// wall-clock measurement of actual render time in the absence of the timer-query extension.
function drawAndSync(prog, w, h) {
  draw(prog, -2, 2, -2, 2, 1.0);
  const px = new Uint8Array(4);
  gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
}

function benchmark(modeName, w, h, warmup, samples) {
  canvas.width = w; canvas.height = h;
  gl.viewport(0, 0, w, h);
  const prog = programs[modeName];
  for (let i = 0; i < warmup; i++) drawAndSync(prog, w, h);
  const times = [];
  for (let i = 0; i < samples; i++) {
    const t0 = performance.now();
    drawAndSync(prog, w, h);
    times.push(performance.now() - t0);
  }
  times.sort((a, b) => a - b);
  const sum = times.reduce((a, b) => a + b, 0);
  return {
    mode: modeName, w, h, cells: w * h,
    avgMs: +(sum / times.length).toFixed(3),
    minMs: +times[0].toFixed(3),
    maxMs: +times[times.length - 1].toFixed(3),
    medianMs: +times[Math.floor(times.length / 2)].toFixed(3)
  };
}

function runAll() {
  const sizes = [[220,220],[512,512],[800,800],[1200,1200],[1800,1800],[3840,2160]];
  const modes = ['poly','rational','gamma'];
  const results = [];
  for (const mode of modes) {
    for (const [w,h] of sizes) {
      results.push(benchmark(mode, w, h, 5, 20));
    }
  }
  document.getElementById('out').textContent = JSON.stringify(results, null, 2);
  window.__benchResults = results;
  return results;
}

window.__runAll = runAll;
window.__gl = gl;
document.getElementById('out').textContent = 'ready - call window.__runAll()';
</script>
</body>
</html>
