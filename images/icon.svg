<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#1A2F42"/>
  <!-- large italic e (neon gold) -->
  <text
    x="175"
    y="288"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="Georgia, 'Times New Roman', serif"
    font-style="italic"
    font-size="340"
    fill="#FFD400"
  >e</text>
  <!-- superscript i (neon coral) -->
  <text
